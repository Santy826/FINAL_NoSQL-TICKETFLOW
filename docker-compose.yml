services:
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts

  api-2:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    ports:
      - "${API_2_PORT:-8001}:8000"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  mongodb:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketflow_compare
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  redis_data:
  postgres_data:
